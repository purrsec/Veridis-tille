[project]
name = "veridis-tille"
version = "0.1.0"
description = "Pairwise music similarity using synchronized MIDI and full-mix chroma"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.0",
]

[project.scripts]
veridis-tille = "veridis_tille.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests", "experiences"]
pythonpath = ["."]
